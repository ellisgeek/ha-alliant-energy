[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "ha-alliant-energy"
version = "2026.10.2"
description = "Home Assistant integration for Alliant Energy electric and gas usage"
requires-python = ">=3.14.2"
dependencies = ["homeassistant>=2026.10", "curl_cffi==0.16.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.6",
    "ty>=0.0.89",
    "prek>=0.5.5",
    "bumpver>=2026.1132",
    "git-cliff>=2.14.2",
    # Runtime requirement from manifest.json; here so ty can resolve it.
    "pdfplumber==0.11.10",
    # Recorder runtime deps that HA imports but doesn't declare in core
    # metadata; needed so the statistics module imports under test.
    "psutil-home-assistant",
    "fnv-hash-fast",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["custom_components", "tests"]

[tool.bumpver]
# CalVer like Home Assistant: YYYY.M.MICRO; MICRO resets each month (ADR 0009).
# Driven by scripts/release.sh, which also writes the changelog, commits, and tags.
current_version = "2026.10.2"
version_pattern = "YYYY.MM.INC0"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', '^version = "{version}"']
"custom_components/alliant_energy/manifest.json" = ['"version": "{version}"']

[tool.git-cliff.changelog]
# Keep a Changelog 1.1.0 (https://keepachangelog.com/en/1.1.0/), generated from
# Conventional Commits. Only user-facing changes are listed; docs, test, build,
# ci, and refactor commits are left out unless marked breaking. A breaking
# change's BREAKING CHANGE footer is printed under its entry, to tell users
# what to do.
header = """# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project uses calendar versioning, `YYYY.M.MICRO`, like Home Assistant
(see [ADR 0009](docs/adr/0009-calendar-versioning.md)).
"""
body = """
{% if version -%}
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description | trim != commit.message | split(pat="\n") | first | trim %}
  - {{ commit.breaking_description | trim | upper_first }}\
{% endif %}\
{% endfor %}
{% endfor %}
"""
footer = """
{% for release in releases -%}
{% if release.version -%}
{% if release.previous.version -%}
[{{ release.version }}]: https://github.com/ellisgeek/ha-alliant-energy/compare/{{ release.previous.version }}...{{ release.version }}
{% else -%}
[{{ release.version }}]: https://github.com/ellisgeek/ha-alliant-energy/releases/tag/{{ release.version }}
{% endif -%}
{% else -%}
[unreleased]: https://github.com/ellisgeek/ha-alliant-energy/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor -%}"""
trim = false

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Breaking changes are always listed, even for commit types that are skipped.
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^20[0-9]{2}\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
# First match wins. HTML comments only order the sections.
commit_parsers = [
    { message = "^build\\(release\\)", skip = true },
    { message = "^fix\\(security\\)", group = "<!-- 5 -->Security" },
    { message = "^(feat|fix|perf)(\\(.*\\))?!?: [Dd]eprecate", group = "<!-- 2 -->Deprecated" },
    { message = "^(feat|fix|perf)(\\(.*\\))?!?: ([Rr]emove|[Dd]rop)", group = "<!-- 3 -->Removed" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^perf", group = "<!-- 1 -->Changed" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
    { message = ".*", skip = true },
]

[tool.uv.build-backend]
# The integration ships as the `custom_components` package at the repo root
# rather than a src/ layout, so point the build backend at it directly.
module-root = ""
module-name = "custom_components"

[tool.mutmut]
source_paths = ["custom_components"]
only_mutate = [
    "custom_components/alliant_energy/api.py",
    "custom_components/alliant_energy/billparser.py",
    "custom_components/alliant_energy/rates.py",
    "custom_components/alliant_energy/usage.py",
]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]
