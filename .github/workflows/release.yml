name: Release

# Publishes a GitHub release when a CalVer tag is pushed. Cut the release
# locally first with scripts/release.sh (bump, changelog, commit, tag), then
# push the commit and the tag.
on:
  push:
    tags:
      - "20[0-9][0-9].*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for git-cliff

      - name: Check tag matches the manifest version
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^20[0-9]{2}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$tag' is not CalVer YYYY.M.MICRO (e.g. 2026.10.0)"
            exit 1
          fi
          manifest="$(jq -r .version custom_components/alliant_energy/manifest.json)"
          if [[ "$manifest" != "$tag" ]]; then
            echo "::error::Tag '$tag' does not match manifest.json version '$manifest'; cut releases with scripts/release.sh"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Check
        run: |
          uv run prek run --all-files --show-diff-on-failure
          uv run pytest -q

      - name: Release notes
        run: uv run git-cliff --current --strip all --output "$RUNNER_TEMP/notes.md"

      - name: Build zip
        run: |
          cd custom_components/alliant_energy
          zip -r "$GITHUB_WORKSPACE/alliant_energy.zip" . -x '__pycache__/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" alliant_energy.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
