name: Release

# Manual, one-click release: bump the CalVer version, regenerate the
# changelog, commit and tag (scripts/release.sh), push, then publish a GitHub
# release with the generated notes and the zip HACS installs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for git-cliff and bumpver

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Check
        run: |
          uv run prek run --all-files --show-diff-on-failure
          uv run pytest -q

      - name: Bump version, update changelog, commit, and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(scripts/release.sh --notes "$RUNNER_TEMP/notes.md" | tail -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push --atomic origin "HEAD:$GITHUB_REF_NAME" "refs/tags/${{ steps.bump.outputs.version }}"

      - name: Build zip
        run: |
          cd custom_components/alliant_energy
          zip -r "$GITHUB_WORKSPACE/alliant_energy.zip" . -x '__pycache__/*'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "$VERSION" alliant_energy.zip \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
